services:
  postgres:
    image: postgres:16-alpine
    container_name: estoque_postgres
    environment:
      POSTGRES_USER: estoque_user
      POSTGRES_PASSWORD: estoque_pass
      POSTGRES_DB: estoque_db
    ports:
      - "5432:5432"
    volumes:
      - estoque_pgdata:/var/lib/postgresql/data

volumes:
  estoque_pgdata:
