[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# um único event loop para a sessão inteira: o engine do app (asyncpg + pool) fica preso ao
# loop que o criou, então testes e fixtures precisam compartilhá-lo
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    stress: testes de estresse de concorrência (mais lentos). Pule com: pytest -m "not stress"
filterwarnings =
    ignore::DeprecationWarning
    error::sqlalchemy.exc.SAWarning
