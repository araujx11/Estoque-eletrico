<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estoque Elétrico</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="shell" id="shell" hidden>
  <aside class="side" id="side">
    <h1>⚡ Estoque Elétrico</h1>
    <nav id="menu"></nav>
    <div class="user">
      <b id="uNome"></b>
      <span class="perfil" id="uPerfil"></span>
      <button id="btnSair" type="button">Sair</button>
    </div>
  </aside>
  <div class="content">
    <div class="topbar"><button id="btnMenu" type="button" aria-label="Abrir menu">☰</button><b>Estoque Elétrico</b></div>
    <main id="pagina"></main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<!-- Chart.js 4.4.1 (versão fixa) via cdnjs; sem ele o dashboard mostra os números e avisa que os gráficos estão indisponíveis -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
