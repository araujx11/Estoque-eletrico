<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Estoque Elétrico</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h1>⚡ Estoque Elétrico</h1>
    <div class="mut">Controle de estoque — Engenharia Elétrica</div>
    <form id="fLogin">
      <label>E-mail<input name="email" type="email" autocomplete="username" required autofocus></label>
      <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
      <button type="submit">Entrar</button>
    </form>
    <div id="erro" class="erro" role="alert" hidden></div>
  </div>
</div>
<script type="module" src="/static/js/login.js"></script>
</body>
</html>
